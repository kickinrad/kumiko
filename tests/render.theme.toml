# The render test's kit: every Material colour role mapped in both modes, faces Google Fonts serves, and accents
# that hold 4.5:1 as text on every surface, so a failure in tests/render.test.ts is the page's, not the kit's.
name = "acme"
default = "night"

[media]
day = "(prefers-color-scheme: light)"

[palette.night]
page = "#121212"
low = "#1c1c1c"
mid = "#242424"
high = "#2e2e2e"
top = "#383838"
text = "#f0f0f0"
subtext = "#c4c4c4"
line = "#8a8a8a"
divider = "#444444"
blue = "#8ab4f8"
on-blue = "#0d1f3c"
blue-box = "#1f3a63"
on-blue-box = "#d6e4ff"
teal = "#6fd6c4"
on-teal = "#0b2a25"
teal-box = "#1b4740"
on-teal-box = "#c9f5ec"
purple = "#c3a6ff"
on-purple = "#2a1559"
purple-box = "#3d2b6b"
on-purple-box = "#ece1ff"
red = "#ff8a80"
on-red = "#3b0a07"
red-box = "#5c1712"
on-red-box = "#ffdad6"

[palette.day]
page = "#fafafa"
low = "#f2f2f2"
mid = "#ebebeb"
high = "#e3e3e3"
top = "#dbdbdb"
text = "#1a1a1a"
subtext = "#4a4a4a"
line = "#6e6e6e"
divider = "#c4c4c4"
blue = "#174ea6"
on-blue = "#ffffff"
blue-box = "#d6e4ff"
on-blue-box = "#0d1f3c"
teal = "#00594f"
on-teal = "#ffffff"
teal-box = "#c9f5ec"
on-teal-box = "#0b2a25"
purple = "#5b34a8"
on-purple = "#ffffff"
purple-box = "#ece1ff"
on-purple-box = "#2a1559"
red = "#a1221b"
on-red = "#ffffff"
red-box = "#ffdad6"
on-red-box = "#410e0b"

[roles]
"md.sys.color.background" = "page"
"md.sys.color.on-background" = "text"
"md.sys.color.surface" = "page"
"md.sys.color.surface-dim" = "page"
"md.sys.color.surface-bright" = "top"
"md.sys.color.surface-container-lowest" = "page"
"md.sys.color.surface-container-low" = "low"
"md.sys.color.surface-container" = "mid"
"md.sys.color.surface-container-high" = "high"
"md.sys.color.surface-container-highest" = "top"
"md.sys.color.surface-variant" = "top"
"md.sys.color.on-surface" = "text"
"md.sys.color.on-surface-variant" = "subtext"
"md.sys.color.outline" = "line"
"md.sys.color.outline-variant" = "divider"
"md.sys.color.inverse-surface" = "day.page"
"md.sys.color.inverse-on-surface" = "day.text"
"md.sys.color.inverse-primary" = "day.blue"
"md.sys.color.scrim" = "night.page"
"md.sys.color.shadow" = "night.page"
"md.sys.color.surface-tint" = "blue"
"md.sys.color.primary" = "blue"
"md.sys.color.on-primary" = "on-blue"
"md.sys.color.primary-container" = "blue-box"
"md.sys.color.on-primary-container" = "on-blue-box"
"md.sys.color.secondary" = "teal"
"md.sys.color.on-secondary" = "on-teal"
"md.sys.color.secondary-container" = "teal-box"
"md.sys.color.on-secondary-container" = "on-teal-box"
"md.sys.color.tertiary" = "purple"
"md.sys.color.on-tertiary" = "on-purple"
"md.sys.color.tertiary-container" = "purple-box"
"md.sys.color.on-tertiary-container" = "on-purple-box"
"md.sys.color.error" = "red"
"md.sys.color.on-error" = "on-red"
"md.sys.color.error-container" = "red-box"
"md.sys.color.on-error-container" = "on-red-box"

[roles.day]
"md.sys.color.inverse-surface" = "night.page"
"md.sys.color.inverse-on-surface" = "night.text"
"md.sys.color.inverse-primary" = "night.blue"

[faces]
brand = ["Roboto Serif", "serif"]
plain = ["Roboto Flex", "sans-serif"]
mono = ["Roboto Mono", "monospace"]
