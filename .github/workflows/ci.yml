name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run setup
      - run: mise run check
      # The playground's client is linted as a consumer would be.
      - run: bun bin/kumiko.mjs lint src/web/playground.js src/web/foundations.js src/web/components.js src/web/cards.js src/web/pages.js src/web/examples.js src/web/tailwind.html
      - name: Material baseline matches androidx
        run: bun scripts/vendor-m3.mjs --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run build
      - run: bun test
        env:
          KUMIKO_BIN: dist/kumiko-linux-x64
