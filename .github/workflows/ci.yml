name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require breaking marker for golden-output changes
        if: github.event_name == 'pull_request'
        run: .github/scripts/check-golden-breaking.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run setup
      - run: mise run check
      - run: mise run test
      - name: Material baseline matches androidx
        run: bun scripts/vendor-m3.mjs --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run build
      - run: bun test
        env:
          TOKENS_BIN: dist/tokens-linux-x64
