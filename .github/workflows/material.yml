name: material

# On demand only: re-vendor the androidx Material 3 tokens at androidx-main (or a given SHA). If
# material/ would change, keep ONE rolling Issue up to date naming the SHAs and the changed files. Never pushes or
# opens PRs; taking the change is `bun scripts/vendor-m3.mjs --sha <sha>` on a branch. An unknown Kotlin form
# fails the run.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: androidx commit to compare against (default androidx-main HEAD)
        required: false

permissions:
  contents: read
  issues: write

jobs:
  material:
    if: github.repository == 'kickinrad/tokens'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - name: Re-vendor and update the rolling Issue
        env:
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          old=$(jq -r .sha material/manifest.json)
          new="${SHA:-$(gh api repos/androidx/androidx/commits/androidx-main --jq .sha)}"
          # Regenerate from scratch so files upstream removed show as deleted.
          rm -r material/m3 material/tv
          bun scripts/vendor-m3.mjs --sha "$new"
          # Files whose tokens changed: each file's header names the SHA and each token cites a line, so those
          # lines change on every bump and are ignored here, as are the manifest and the generated index.
          git add --intent-to-add material/
          # shellcheck disable=SC2016 # literal $ in the regex
          files=$(git diff HEAD -I '"\$description": ' -I '"src": ' -- material/ ':(exclude)material/manifest.json' ':(exclude)material/index.mjs' | sed -n 's|^diff --git a/\([^ ]*\) .*|\1|p')
          if [ -z "$files" ]; then echo "No Material token changed at $new (citations may have moved)"; exit 0; fi
          # shellcheck disable=SC2086 # one path per word
          changed=$(git diff HEAD --name-status -- $files)
          title="Upstream Material 3 tokens changed"
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          body=$(printf 'androidx changed the built-in Material 3 tokens.\n\n- New SHA: `%s`\n- Manifest SHA: `%s`\n- Compare: https://github.com/androidx/androidx/compare/%s...%s\n\nChanged files:\n\n```\n%s\n```\n\nTo take it, run `bun scripts/vendor-m3.mjs --sha %s` on a branch and review what a kit overrides.\n' \
            "$new" "$old" "$old" "$new" "$changed" "$new")
          gh label create upstream --color 0e8a16 --description "Upstream Material 3 changes" --force
          issue=$(gh issue list --state open --label upstream --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then gh issue edit "$issue" --body "$body"; else gh issue create --title "$title" --label upstream --body "$body"; fi
